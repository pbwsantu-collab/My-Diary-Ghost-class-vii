    margin-bottom: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #fafbfc;
    border-left: 3px solid #b2cbe0;
    transition: background 0.2s ease, border-color 0.2s ease;

  .sentence-block.active { background: #e8f8f5; border-left-color: #27ae60; }

    font-size: 1rem;
    line-height: 1.5;
    color: #111;
  }

  .word {
    display: inline;
    padding: 0 1px;
    border-radius: 2px;
  }

  .bengali-drawer {

    margin-top: 6px;
    padding: 6px 10px;
    background: #112d42;
    color: #ffe082;
    border-radius: 6px;

  }

    border: 2px solid #ffc107; border-radius: 10px; padding: 10px 12px;

  #popup .speak-btn { background: #27ae60; color: white; border: none; padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; cursor: pointer; }
  #popup .close-btn { position: absolute; top: 4px; right: 8px; background: none; border: none; font-size: 1rem; cursor: pointer; }

let currentLessonData = lesson12Data;
let currentUnitIdx = 0;
let currentSentence = 0;
let isPlaying = false;
let isPaused = false;
let englishVoice = null;
let speechRate = 0.85;
let showAllBn = false;

const storyContainer = document.getElementById('storyContainer');
const statusBar = document.getElementById('statusBar');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const toggleModeBtn = document.getElementById('toggleModeBtn');
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');
const popup = document.getElementById('popup');
const popupEn = document.getElementById('popupEn');
const popupBn = document.getElementById('popupBn');
const popupSpeak = document.getElementById('popupSpeak');
const popupClose = document.getElementById('popupClose');
const unitTitle = document.getElementById('unitTitle');
const unitMenu = document.getElementById('unitMenu');

function selectLesson(num) {
  stopAll();
  document.getElementById('tabL12').classList.toggle('active', num === 12);
  document.getElementById('tabL13').classList.toggle('active', num === 13);
  
  currentLessonData = (num === 12) ? lesson12Data : lesson13Data;
  document.getElementById('lessonMainTitle').textContent = currentLessonData.title;
  document.getElementById('lessonSubTitle').textContent = currentLessonData.author + " • Interactive Reader";
  
  renderUnitMenu();
  switchUnit(0);
}

function renderUnitMenu() {
  unitMenu.innerHTML = '';
  currentLessonData.units.forEach((u, idx) => {
    const btn = document.createElement('button');
    btn.textContent = u.title;
    btn.className = idx === currentUnitIdx ? 'active' : '';
    btn.onclick = () => switchUnit(idx);
    unitMenu.appendChild(btn);
  });
}

function switchUnit(idx) {
  stopAll();
  currentUnitIdx = idx;
  Array.from(unitMenu.children).forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
  const unit = currentLessonData.units[idx];
  unitTitle.textContent = unit.title;
  buildStory();
}

function buildStory() {
  const unit = currentLessonData.units[currentUnitIdx];
  storyContainer.innerHTML = '';
  
  unit.sentences.forEach((s, sIdx) => {
    const block = document.createElement('div');
    block.className = 'sentence-block';
    block.dataset.sidx = sIdx;

    let englishHtml = '<div class="english-line">';
    const tokens = s.en.match(/[\w'’]+|[.,!?;:"“”()]|\s+/g) || [];
    tokens.forEach(tok => {
      if (tok.trim() && /[\w'’]/.test(tok)) {
        const clean = tok.toLowerCase().replace(/[’']/g, "");
        const hasMeaning = dictionary.hasOwnProperty(clean);
        const cls = hasMeaning ? "word has-meaning" : "word";
        englishHtml += `<span class="${cls}" data-word="${clean}">${tok}</span>`;
      } else {
        englishHtml += tok;
      }
    });
    englishHtml += '</div>';

    const bengaliHtml = `<div class="bengali-drawer">${s.bn}</div>`;
    block.innerHTML = englishHtml + bengaliHtml;

    block.addEventListener('click', (e) => {
      if (e.target.classList.contains('word')) {
        e.stopPropagation();
        showWordPopup(e.target);
        return;
      }
      document.querySelectorAll('.sentence-block').forEach(b => {
        if (b !== block) b.classList.remove('show-bn');
      });
      block.classList.toggle('show-bn');
    });

    storyContainer.appendChild(block);
  });
}

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  englishVoice = voices.find(v => v.lang === 'en-IN') || voices.find(v => v.lang.startsWith('en'));
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function highlightSentence(sIdx) {
  document.querySelectorAll('.sentence-block').forEach((b, i) => {
    const isActive = (i === sIdx);
    b.classList.toggle('active', isActive);
    b.classList.toggle('show-bn', isActive);
    if (isActive) {
      b.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}

function speakText(text, onEnd) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = englishVoice;
  u.rate = speechRate;
  u.onend = () => { if (onEnd) onEnd(); };
  u.onerror = () => { if (onEnd) onEnd(); };
  speechSynthesis.speak(u);
}

function showWordPopup(el) {
  const word = el.dataset.word;
  const meaning = dictionary[word] || "অর্থ: বাক্যভিত্তিক অর্থ নিচের বক্সে দেখে নিন।";
  popupEn.textContent = word.charAt(0).toUpperCase() + word.slice(1);
  popupBn.textContent = meaning;
  popup.classList.add('show');
}

popupClose.addEventListener('click', () => popup.classList.remove('show'));
popupSpeak.addEventListener('click', () => speakText(popupEn.textContent));

toggleModeBtn.addEventListener('click', () => {
  showAllBn = !showAllBn;
  document.body.classList.toggle('show-all-bn', showAllBn);
  toggleModeBtn.textContent = showAllBn ? "🙈 Hide All Bengali" : "🌐 Show All Bengali";
});

function playNext() {
  const unit = currentLessonData.units[currentUnitIdx];
  if (!isPlaying || isPaused) return;
  if (currentSentence >= unit.sentences.length) {
    stopAll();
    statusBar.textContent = 'Finished reading section ✓';
    return;
  }
  const s = unit.sentences[currentSentence];
  highlightSentence(currentSentence);
  statusBar.textContent = `Reading ${currentSentence + 1} of ${unit.sentences.length}`;

  speakText(s.en, () => {
    if (!isPlaying || isPaused) return;
    setTimeout(() => {
      if (!isPlaying || isPaused) return;
      currentSentence++;
      playNext();
    }, 300);
  });
}

function play() {
  if (isPaused) {
    isPaused = false;
    speechSynthesis.resume();
    playBtn.disabled = true;
    pauseBtn.disabled = false;
    return;
  }
  speechSynthesis.cancel();
  currentSentence = 0;
  isPlaying = true;
  isPaused = false;
  playBtn.disabled = true;
  pauseBtn.disabled = false;
  stopBtn.disabled = false;
  playNext();
}

function pause() {
  isPaused = true;
  speechSynthesis.pause();
  playBtn.disabled = false;
  pauseBtn.disabled = true;
}

function stopAll() {
  isPlaying = false;
  isPaused = false;
  speechSynthesis.cancel();
  currentSentence = 0;
  document.querySelectorAll('.sentence-block').forEach(b => {
    b.classList.remove('active');
    if (!showAllBn) b.classList.remove('show-bn');
  });
  playBtn.disabled = false;
  pauseBtn.disabled = true;
  stopBtn.disabled = true;
  statusBar.textContent = 'Tap any line to view Bengali translation directly underneath';
}

speedSlider.addEventListener('input', () => {
  speechRate = parseFloat(speedSlider.value);
  speedValue.textContent = speechRate.toFixed(2) + 'x';
});
playBtn.addEventListener('click', play);
pauseBtn.addEventListener('click', pause);
stopBtn.addEventListener('click', stopAll);

selectLesson(12);
setTimeout(loadVoices, 500);
</script>
</body>
</html>
