<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class VIII English Reader - Close Sentence Translation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: #f4f7f9;
    color: #1a1a1a;
    line-height: 1.6;
    padding: 6px;
    min-height: 100vh;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    overflow: hidden;
    padding-bottom: 20px;
  }
  header {
    background: linear-gradient(135deg, #1a5276, #154360);
    color: white;
    padding: 14px 16px;
    text-align: center;
  }
  header h1 { font-size: 1.35rem; margin-bottom: 2px; }
  header p { opacity: 0.9; font-size: 0.8rem; }

  .lesson-tabs {
    display: flex;
    justify-content: center;
    background: #0e2e43;
    padding: 6px;
    gap: 6px;
  }
  .lesson-tabs button {
    padding: 6px 12px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #d4e6f1;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 20px;
  }
  .lesson-tabs button.active { background: #1a5276; color: #fff; }

  .menu {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 8px;
    background: #eaf2f8;
    border-bottom: 1px solid #d0dce8;
  }
  .menu button {
    padding: 5px 12px;
    border: 1.5px solid #1a5276;
    border-radius: 20px;
    background: white;
    color: #1a5276;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .menu button.active { background: #1a5276; color: white; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: center;
    padding: 8px;
    background: #f0f4f8;
    border-bottom: 1px solid #dce4ec;
  }
  button.action-btn {
    padding: 6px 14px;
    border: none;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  #playBtn { background: #27ae60; color: #fff; }
  #pauseBtn { background: #e67e22; color: #fff; }
  #stopBtn { background: #c0392b; color: #fff; }
  #toggleModeBtn { background: #8e44ad; color: #fff; }
  
  .speed-box {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid #1a5276;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 0.75rem;
    color: #1a5276;
    font-weight: 600;
  }
  .speed-box input[type=range] { width: 55px; accent-color: #1a5276; }

  .status-bar {
    text-align: center;
    padding: 6px;
    font-size: 0.78rem;
    background: #e8f0f7;
    color: #1a5276;
    font-weight: 600;
  }
  
  .content { padding: 12px; }
  h2 { color: #1a5276; margin: 8px 0; font-size: 1.1rem; border-bottom: 2px solid #eaf2f8; padding-bottom: 4px; }
  
  /* Sentence Blocks - Stacked for ultra-close reading */
  .sentence-block {
    margin-bottom: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    background: #fafbfc;
    border-left: 3px solid #b2cbe0;
    transition: background 0.2s ease, border-color 0.2s ease;
    cursor: pointer;
  }
  .sentence-block:hover { background: #f0f7fc; border-left-color: #3498db; }
  .sentence-block.active { background: #e8f8f5; border-left-color: #27ae60; }

  .english-line {
    font-size: 1rem;
    line-height: 1.5;
    color: #111;
  }

  .word {
    display: inline;
    padding: 0 1px;
    border-radius: 2px;
  }
  .word.has-meaning { border-bottom: 1.5px dotted #2980b9; }

  /* In-Flow Bengali Translation Banner - Positioned RIGHT under sentence */
  .bengali-drawer {
    display: none;
    margin-top: 5px;
    padding: 6px 10px;
    background: #112d42;
    color: #ffe082;
    border-radius: 6px;
    font-family: 'Noto Sans Bengali', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.45;
    border: 1px solid #f39c12;
  }
  .sentence-block.show-bn .bengali-drawer,
  body.show-all-bn .bengali-drawer {
    display: block;
  }

  /* Word Dictionary Popup */
  #popup {
    position: fixed; z-index: 1000; background: #fff8e1;
    border: 2px solid #ffc107; border-radius: 10px; padding: 10px 12px;
    max-width: 260px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    font-family: 'Noto Sans Bengali', sans-serif; display: none;
    bottom: 20px; left: 50%; transform: translateX(-50%);
  }
  #popup.show { display: block; }
  #popup .en { font-family: 'Poppins', sans-serif; font-size: 0.95rem; color: #1a5276; font-weight: 600; }
  #popup .bn { font-size: 0.95rem; color: #111; margin: 4px 0 6px; font-weight: 600; }
  #popup .speak-btn { background: #27ae60; color: white; border: none; padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; cursor: pointer; }
  #popup .close-btn { position: absolute; top: 4px; right: 8px; background: none; border: none; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="lessonMainTitle">Lesson 12: My Diary</h1>
    <p id="lessonSubTitle">Anne Frank • Interactive Reader</p>
  </header>

  <div class="lesson-tabs">
    <button id="tabL12" class="active" onclick="selectLesson(12)">Lesson 12</button>
    <button id="tabL13" onclick="selectLesson(13)">Lesson 13</button>
  </div>

  <div class="menu" id="unitMenu"></div>

  <div class="controls">
    <button id="playBtn" class="action-btn">▶ Play</button>
    <button id="pauseBtn" class="action-btn" disabled>⏸ Pause</button>
    <button id="stopBtn" class="action-btn" disabled>⏹ Stop</button>
    <button id="toggleModeBtn" class="action-btn">🌐 Show All Bengali</button>
    <div class="speed-box">
      <span>Speed</span>
      <input type="range" id="speedSlider" min="0.6" max="1.3" step="0.1" value="0.85">
      <span id="speedValue">0.85x</span>
    </div>
  </div>

  <div class="status-bar" id="statusBar">Tap any line to read Bengali meaning directly below</div>

  <div class="content">
    <h2 id="unitTitle">Unit Title</h2>
    <div id="storyContainer"></div>
  </div>
</div>

<div id="popup">
  <button class="close-btn" id="popupClose">×</button>
  <div class="en" id="popupEn"></div>
  <div class="bn" id="popupBn"></div>
  <button class="speak-btn" id="popupSpeak">🔊 Pronounce</button>
</div>

const lesson12Data = {
  title: "Lesson 12: My Diary",
  author: "Anne Frank",
  units: [

        { en: "On Friday, June 12th, I woke up at six o'clock and no wonder, it was my birthday.", bn: "শুক্রবার, ১২ই জুন, আমি সকাল ছয়টায় জেগে উঠেছিলাম এবং এতে অবাক হওয়ার কিছু নেই, কারণ এটা ছিল আমার জন্মদিন।" },

let currentLessonData = lesson12Data;
let currentUnitIdx = 0;
let currentSentence = 0;
let isPlaying = false;
let isPaused = false;
let englishVoice = null;

const pauseBtn = document.getElementById('pauseBtn');

const unitTitle = document.getElementById('unitTitle');
const unitMenu = document.getElementById('unitMenu');

function selectLesson(num) {
  stopAll();
  document.getElementById('tabL12').classList.toggle('active', num === 12);
  document.getElementById('tabL13').classList.toggle('active', num === 13);
  
  currentLessonData = (num === 12) ? lesson12Data : lesson13Data;
  document.getElementById('lessonMainTitle').textContent = currentLessonData.title;
  document.getElementById('lessonSubTitle').textContent = currentLessonData.author + " • Interactive Reader";
  
  renderUnitMenu();
  switchUnit(0);
}

function renderUnitMenu() {
  unitMenu.innerHTML = '';
  currentLessonData.units.forEach((u, idx) => {
    const btn = document.createElement('button');
    btn.textContent = u.title;
    btn.className = idx === currentUnitIdx ? 'active' : '';
    btn.onclick = () => switchUnit(idx);
    unitMenu.appendChild(btn);
  });
}

function switchUnit(idx) {
  stopAll();
  currentUnitIdx = idx;
  Array.from(unitMenu.children).forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
  const unit = currentLessonData.units[idx];
  unitTitle.textContent = unit.title;
  buildStory();
}

function buildStory() {
  const unit = currentLessonData.units[currentUnitIdx];
  storyContainer.innerHTML = '';
  
  unit.sentences.forEach((s, sIdx) => {
    const block = document.createElement('div');
    block.className = 'sentence-block';
    block.dataset.sidx = sIdx;

    let englishHtml = '<div class="english-line">';
    const tokens = s.en.match(/[\w'’]+|[.,!?;:"“”()]|\s+/g) || [];
    tokens.forEach(tok => {
      if (tok.trim() && /[\w'’]/.test(tok)) {
        const clean = tok.toLowerCase().replace(/[’']/g, "");
        const hasMeaning = dictionary.hasOwnProperty(clean);
        const cls = hasMeaning ? "word has-meaning" : "word";
        englishHtml += `<span class="${cls}" data-word="${clean}">${tok}</span>`;
      } else {
        englishHtml += tok;
      }
    });
    englishHtml += '</div>';

    const bengaliHtml = `<div class="bengali-drawer">${s.bn}</div>`;
    block.innerHTML = englishHtml + bengaliHtml;

    block.addEventListener('click', (e) => {
      if (e.target.classList.contains('word')) {
        e.stopPropagation();
        showWordPopup(e.target);
        return;
      }
      document.querySelectorAll('.sentence-block').forEach(b => {
        if (b !== block) b.classList.remove('show-bn');
      });
      block.classList.toggle('show-bn');
    });

    storyContainer.appendChild(block);
  });
}

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  englishVoice = voices.find(v => v.lang === 'en-IN') || voices.find(v => v.lang.startsWith('en'));
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function highlightSentence(sIdx) {
  document.querySelectorAll('.sentence-block').forEach((b, i) => {
    const isActive = (i === sIdx);
    b.classList.toggle('active', isActive);
    b.classList.toggle('show-bn', isActive);
    if (isActive) {
      b.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}

function speakText(text, onEnd) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = englishVoice;
  u.rate = speechRate;
  u.onend = () => { if (onEnd) onEnd(); };
  u.onerror = () => { if (onEnd) onEnd(); };
  speechSynthesis.speak(u);
}

function showWordPopup(el) {
  const word = el.dataset.word;
  const meaning = dictionary[word] || "অর্থ: বাক্যভিত্তিক অর্থ নিচের বক্সে দেখে নিন।";
  popupEn.textContent = word.charAt(0).toUpperCase() + word.slice(1);
  popupBn.textContent = meaning;
  popup.classList.add('show');
}

popupClose.addEventListener('click', () => popup.classList.remove('show'));
popupSpeak.addEventListener('click', () => speakText(popupEn.textContent));

toggleModeBtn.addEventListener('click', () => {
  showAllBn = !showAllBn;
  document.body.classList.toggle('show-all-bn', showAllBn);
  toggleModeBtn.textContent = showAllBn ? "🙈 Hide All Bengali" : "🌐 Show All Bengali";
});

function playNext() {
  const unit = currentLessonData.units[currentUnitIdx];
  if (!isPlaying || isPaused) return;
  if (currentSentence >= unit.sentences.length) {
    stopAll();
    statusBar.textContent = 'Finished reading section ✓';
    return;
  }
  const s = unit.sentences[currentSentence];
  highlightSentence(currentSentence);
  statusBar.textContent = `Reading ${currentSentence + 1} of ${unit.sentences.length}`;

  speakText(s.en, () => {
    if (!isPlaying || isPaused) return;
    setTimeout(() => {
      if (!isPlaying || isPaused) return;
      currentSentence++;
      playNext();
    }, 300);
  });
}

function play() {
  if (isPaused) {
    isPaused = false;
    speechSynthesis.resume();
    playBtn.disabled = true;
    pauseBtn.disabled = false;
    return;
  }
  speechSynthesis.cancel();
  currentSentence = 0;
  isPlaying = true;
  isPaused = false;
  playBtn.disabled = true;
  pauseBtn.disabled = false;
  stopBtn.disabled = false;
  playNext();
}

function pause() {
  isPaused = true;
  speechSynthesis.pause();
  playBtn.disabled = false;
  pauseBtn.disabled = true;
}

function stopAll() {
  isPlaying = false;
  isPaused = false;
  speechSynthesis.cancel();
  currentSentence = 0;
  document.querySelectorAll('.sentence-block').forEach(b => {
    b.classList.remove('active');
    if (!showAllBn) b.classList.remove('show-bn');
  });
  playBtn.disabled = false;
  pauseBtn.disabled = true;
  stopBtn.disabled = true;
  statusBar.textContent = 'Tap any line to read Bengali meaning directly below';
}

speedSlider.addEventListener('input', () => {
  speechRate = parseFloat(speedSlider.value);
  speedValue.textContent = speechRate.toFixed(2) + 'x';
});
playBtn.addEventListener('click', play);
pauseBtn.addEventListener('click', pause);
stopBtn.addEventListener('click', stopAll);

selectLesson(12);
setTimeout(loadVoices, 500);
</script>
</body>
</html>
